<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="退職リリーフのファーストビュー用デザイン試作。LINEで現在の状況を確認する導線です。"
    />
    <title>失業保険の手続き｜退職リリーフ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__frame">
          <header class="hero__mast" aria-label="退職リリーフの案内">
            <p class="hero__brand">退職リリーフ</p>
            <p class="hero__operator">労働組合 新宿ユニオン</p>
          </header>

          <div class="hero__grid">
            <div class="hero__copy">
              <p class="hero__ribbon">退職を考えている方へ</p>
              <h1 id="hero-title">
                失業保険の<br />
                手続き、<br />
                <strong>いま何から</strong><br />
                確認すればいい？
              </h1>
              <p class="hero__lead">
                退職前・退職直後・離職票待ち。今の状況に合わせて、次に確認することをLINEで整理できます。
              </p>

              <div class="hero__action">
                <p class="hero__action-lead">まずは、いまの状況を</p>
                <a
                  class="line-button"
                  href="https://lin.ee/GjxwUdS"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-cta="hero-line"
                  aria-label="LINEで状況を確認する（新しいタブで開きます）"
                >
                  <span class="line-button__mark" aria-hidden="true">LINE</span>
                  <span>LINEで状況を確認する</span>
                  <span class="line-button__arrow" aria-hidden="true">→</span>
                </a>
                <p class="hero__action-note">LINE追加後に、案内内容を確認してから次を判断できます。</p>
              </div>
            </div>

            <div class="hero__proof">
              <figure class="hero__figure">
                <img
                  src="../taishoku-relief-article-lp/assets/story-search-doubt.webp"
                  width="1536"
                  height="1024"
                  fetchpriority="high"
                  alt="スマートフォンを手に、退職後の手続きを考える男性"
                />
                <figcaption>一人で情報を抱え込む前に、現在地を確認する。</figcaption>
              </figure>

              <aside class="hero__checklist" aria-label="LINEで確認できること">
                <p class="hero__checklist-title">LINEで最初に確認すること</p>
                <ul>
                  <li><span aria-hidden="true">✓</span>退職前・退職直後など、いまの段階</li>
                  <li><span aria-hidden="true">✓</span>手続きで気になっていること</li>
                  <li><span aria-hidden="true">✓</span>次に確認する順番</li>
                </ul>
              </aside>
            </div>
          </div>
        </div>
      </section>

      <section class="hero__after" aria-label="次のセクションの予告">
        <p>LINE追加後の流れは、次のセクションでご案内します。</p>
      </section>
    </main>
  </body>
</html>
